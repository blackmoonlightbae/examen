[project]
name = "arandu"
version = "0.1.0"
description = "Instituto Arandu — inscripcion a materias. Caso de estudio del Taller IV."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arandu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
